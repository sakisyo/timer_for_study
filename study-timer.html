<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勉強タイマー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25%); }
        }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .animate-bounce {
            animation: bounce 1s infinite;
        }
        .wood-texture {
            background-image: url('23671477_m.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        .wood-texture::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }
        .timer-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.08);
        }
        .gradient-text {
            background: linear-gradient(135deg, rgb(222, 184, 135) 0%, rgb(160, 82, 45) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function StudyTimer() {
            const [selectedMinutes, setSelectedMinutes] = useState(25);
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [isRunning, setIsRunning] = useState(false);
            const [isFinished, setIsFinished] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                let interval = null;
                if (isRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft((time) => {
                            if (time <= 1) {
                                setIsRunning(false);
                                setIsFinished(true);
                                if (audioRef.current) {
                                    audioRef.current.play().catch(e => console.log('Audio play failed:', e));
                                }
                                return 0;
                            }
                            return time - 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [isRunning, timeLeft]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleStart = () => {
                if (timeLeft === 0) {
                    setTimeLeft(selectedMinutes * 60);
                    setIsFinished(false);
                }
                setIsRunning(true);
            };

            const handleStop = () => {
                setIsRunning(false);
            };

            const handleReset = () => {
                setIsRunning(false);
                setTimeLeft(selectedMinutes * 60);
                setIsFinished(false);
            };

            const progress = ((selectedMinutes * 60 - timeLeft) / (selectedMinutes * 60)) * 100;

            const presetTimes = [5, 10, 15, 20, 25, 30, 45, 60, 90];

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden wood-texture">
                    <audio ref={audioRef} src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE=" />
                    
                    <div className="timer-container rounded-3xl p-8 md:p-12 w-full max-w-4xl relative z-10">
                        <div className="text-center mb-8">
                            <div className="flex flex-wrap justify-center gap-3 mb-6">
                                {presetTimes.map((mins) => (
                                    <button
                                        key={mins}
                                        onClick={() => {
                                            if (!isRunning) {
                                                setSelectedMinutes(mins);
                                                setTimeLeft(mins * 60);
                                                setIsFinished(false);
                                            }
                                        }}
                                        disabled={isRunning}
                                        className={`glass-button px-6 py-3 rounded-xl text-lg font-semibold transition-all ${
                                            selectedMinutes === mins 
                                                ? 'text-white shadow-lg scale-105' 
                                                : 'text-white/90 hover:bg-white/20 hover:text-white'
                                        } disabled:opacity-50 disabled:cursor-not-allowed`}
                                        style={selectedMinutes === mins ? {
                                            background: `linear-gradient(135deg, rgb(222, 184, 135), rgb(160, 82, 45))`,
                                            borderColor: 'rgba(222, 184, 135, 0.4)'
                                        } : {}}
                                    >
                                        {mins}分
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="relative mb-10 flex items-center justify-center">
                            <div className="relative">
                                <svg className="transform -rotate-90" width="350" height="350" viewBox="0 0 400 400">
                                    <defs>
                                        <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stopColor="rgb(222, 184, 135)" stopOpacity="1" />
                                            <stop offset="50%" stopColor="rgb(191, 133, 90)" stopOpacity="1" />
                                            <stop offset="100%" stopColor="rgb(160, 82, 45)" stopOpacity="1" />
                                        </linearGradient>
                                        <filter id="glow">
                                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                                            <feMerge>
                                                <feMergeNode in="coloredBlur"/>
                                                <feMergeNode in="SourceGraphic"/>
                                            </feMerge>
                                        </filter>
                                    </defs>
                                    <circle
                                        cx="200"
                                        cy="200"
                                        r="170"
                                        stroke="rgba(255, 255, 255, 0.15)"
                                        strokeWidth="16"
                                        fill="none"
                                    />
                                    <circle
                                        cx="200"
                                        cy="200"
                                        r="170"
                                        stroke="url(#progressGradient)"
                                        strokeWidth="18"
                                        fill="none"
                                        strokeDasharray={`${2 * Math.PI * 170}`}
                                        strokeDashoffset={`${2 * Math.PI * 170 * (1 - progress / 100)}`}
                                        className="transition-all duration-1000 ease-linear"
                                        strokeLinecap="round"
                                        filter="url(#glow)"
                                        style={{filter: 'drop-shadow(0 0 12px rgba(160, 82, 45, 0.6))'}}
                                    />
                                    {isRunning && (
                                        <circle
                                            cx="200"
                                            cy="200"
                                            r="170"
                                            stroke="rgba(160, 82, 45, 0.25)"
                                            strokeWidth="16"
                                            fill="none"
                                            strokeDasharray={`${2 * Math.PI * 170}`}
                                            strokeDashoffset={`${2 * Math.PI * 170 * (1 - progress / 100)}`}
                                            className="animate-pulse"
                                            style={{transform: 'rotate(-90deg)', transformOrigin: '200px 200px'}}
                                        />
                                    )}
                                </svg>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <div className="text-center">
                                        <div className={`text-6xl md:text-8xl font-bold mb-2 transition-all ${
                                            isFinished 
                                                ? 'animate-pulse' 
                                                : isRunning
                                                ? 'text-white'
                                                : 'text-white/95'
                                        }`} style={{
                                            color: isFinished ? 'rgb(222, 184, 135)' : undefined,
                                            textShadow: isFinished 
                                                ? '0 0 30px rgba(222, 184, 135, 0.8), 0 4px 8px rgba(0, 0, 0, 0.4)'
                                                : isRunning
                                                ? '0 4px 12px rgba(0, 0, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 0.3)'
                                                : '0 2px 8px rgba(0, 0, 0, 0.3)'
                                        }}>
                                            {formatTime(timeLeft)}
                                        </div>
                                        <div className={`text-sm md:text-lg font-medium ${
                                            isFinished 
                                                ? 'animate-bounce' 
                                                : 'text-white/70'
                                        }`} style={{
                                            color: isFinished ? 'rgb(222, 184, 135)' : undefined,
                                            textShadow: isFinished ? '0 2px 8px rgba(222, 184, 135, 0.6)' : '0 1px 4px rgba(0, 0, 0, 0.3)'
                                        }}>
                                            {isFinished ? '🎉 お疲れ様でした！' : `${selectedMinutes}分セッション`}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-4 justify-center items-center mb-6">
                            {!isRunning ? (
                                <button
                                    onClick={handleStart}
                                    className="text-white px-10 py-4 rounded-2xl text-xl font-bold flex items-center gap-3 shadow-xl transition-all transform hover:scale-105 active:scale-95 w-full sm:w-auto justify-center border"
                                    style={{
                                        backgroundColor: 'rgb(128, 128, 0)',
                                        borderColor: 'rgba(128, 128, 0, 0.5)',
                                        boxShadow: '0 8px 24px rgba(128, 128, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2)'
                                    }}
                                    onMouseEnter={(e) => {
                                        e.target.style.backgroundColor = 'rgb(140, 140, 0)';
                                    }}
                                    onMouseLeave={(e) => {
                                        e.target.style.backgroundColor = 'rgb(128, 128, 0)';
                                    }}
                                >
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                    </svg>
                                    開始
                                </button>
                            ) : (
                                <button
                                    onClick={handleStop}
                                    className="text-white px-10 py-4 rounded-2xl text-xl font-bold flex items-center gap-3 shadow-xl transition-all transform hover:scale-105 active:scale-95 w-full sm:w-auto justify-center border"
                                    style={{
                                        backgroundColor: 'rgb(160, 82, 45)',
                                        borderColor: 'rgba(160, 82, 45, 0.5)',
                                        boxShadow: '0 8px 24px rgba(160, 82, 45, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2)'
                                    }}
                                    onMouseEnter={(e) => {
                                        e.target.style.backgroundColor = 'rgb(170, 92, 55)';
                                    }}
                                    onMouseLeave={(e) => {
                                        e.target.style.backgroundColor = 'rgb(160, 82, 45)';
                                    }}
                                >
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                        <rect x="6" y="4" width="4" height="16"></rect>
                                        <rect x="14" y="4" width="4" height="16"></rect>
                                    </svg>
                                    一時停止
                                </button>
                            )}
                            
                            <button
                                onClick={handleReset}
                                className="glass-button text-white/90 hover:text-white px-10 py-4 rounded-2xl text-xl font-bold flex items-center gap-3 shadow-lg transition-all transform hover:scale-105 active:scale-95 w-full sm:w-auto justify-center"
                            >
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                    <polyline points="1 4 1 10 7 10"></polyline>
                                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                                </svg>
                                リセット
                            </button>
                        </div>

                        <div className="text-center">
                            <div className={`inline-block glass rounded-full px-6 py-3 ${
                                isRunning 
                                    ? 'border shadow-lg' 
                                    : 'text-white/75 border border-white/25'
                            }`} style={{
                                color: isRunning ? 'rgb(222, 184, 135)' : undefined,
                                borderColor: isRunning ? 'rgba(222, 184, 135, 0.4)' : undefined,
                                textShadow: isRunning ? '0 2px 8px rgba(222, 184, 135, 0.4)' : '0 1px 4px rgba(0, 0, 0, 0.2)'
                            }}>
                                <span className="text-sm md:text-base font-medium">
                                    {isRunning ? '✨ 集中モード ✨' : '⏱️ 時間を選択して開始してください'}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudyTimer />);
    </script>
</body>
</html>
